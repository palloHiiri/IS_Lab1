
name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: SAST and SCA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit

      - name: Prepare reports
        run: mkdir -p reports

      - name: Bandit SAST
        id: bandit
        continue-on-error: true
        run: |
          python -m bandit -r app/ run.py -ll \
            -f html -o reports/bandit.html
          result=$?
          echo "Bandit exit code: $result"
          exit $result

      - name: OWASP Dependency-Check SCA
        id: dependency_check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: IS Lab1
          path: requirements.txt
          format: HTML
          out: reports
          args: >
            --enableExperimental
            --failOnCVSS 7
            --disableOssIndex

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      - name: Check security results
        if: always()
        env:
          BANDIT_RESULT: ${{ steps.bandit.outcome }}
          SCA_RESULT: ${{ steps.dependency_check.outcome }}
        run: |
          echo "Bandit: $BANDIT_RESULT"
          echo "OWASP Dependency-Check: $SCA_RESULT"

          if [ "$BANDIT_RESULT" != "success" ] || \
             [ "$SCA_RESULT" != "success" ]; then
            echo "Security checks failed"
            exit 1
          fi

          echo "All security checks passed"
